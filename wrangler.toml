name = "servaster-worker"
main = "worker/index.ts"
compatibility_date = "2024-12-01"

# KV Namespace binding - replace with your actual KV namespace ID
# Create KV namespace: wrangler kv namespace create DIALPLAN_KV
# Then paste the id below
[[kv_namespaces]]
binding = "DIALPLAN_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"
